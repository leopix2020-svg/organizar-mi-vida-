async function handleAction(action, el){
  switch(action){
    case 'open-settings': openSettings(); break;
    case 'close-modal': closeModal(); break;
    case 'prev-month': ui.monthOffset--; render(); break;
    case 'next-month': ui.monthOffset = Math.min(0, ui.monthOffset+1); render(); break;
    case 'set-viewmode': ui.viewMode = el.dataset.mode; render(); break;
    case 'goto-tab': ui.section='finanzas'; ui.tab = el.dataset.tab; render(); break;

    case 'fab':
      if(ui.tab==='metas') openAddGoal();
      else if(ui.tab==='cuentas') openAccountForm(null);
      else if(ui.tab==='inversiones') openBolsaFundModal('in');
      else if(ui.tab==='deudas') openDebtModal();
      else openAddTransaction();
      break;
    case 'add-txn': openAddTransaction(); break;
    case 'add-goal': openAddGoal(); break;
    case 'add-account': openAccountForm(null); break;
    case 'add-debt': openDebtModal(); break;

    case 'set-txn-type': ui.txnType = el.dataset.type; ui.txnCat=null; captureTxnDraft(); renderTxnModal(); break;
    case 'set-txn-cat': ui.txnCat = el.dataset.cat; captureTxnDraft(); renderTxnModal(); break;
    case 'save-txn': {
      var amount = parseFloat(document.getElementById('txn-amount').value);
      var date = document.getElementById('txn-date').value || todayStr();
      var note = document.getElementById('txn-note').value.trim();
      var accountId = document.getElementById('txn-account').value;
      if(!amount || amount<=0){ showToast('Ingresa un monto válido.'); return; }
      if(ui.viewMode==='mensual' && !isInMonth(date, ui.monthOffset)){ showToast('La fecha debe estar dentro de '+monthLabel(ui.monthOffset).toLowerCase()+'.'); return; }
      if(ui.txnType==='expense'){
        var bal = accountBalance(accountId);
        if(bal < amount){ var accX=findAccount(accountId); showToast('Tu wallet '+(accX?accX.name:'')+' solo tiene '+fmt(bal)+' disponibles.'); return; }
      }
      state.transactions.push({ id:uid(), type:ui.txnType, amount:amount, category:ui.txnCat, date:date, note:note, createdAt:Date.now(), accountId:accountId });
      ui.txnDraft = null;
      closeModal(); await saveState(); render(); showToast('Movimiento guardado.');
      break;
    }
    case 'ask-delete-txn': ui.confirmDeleteId = el.dataset.id; render(); setTimeout(function(){ if(ui.confirmDeleteId===el.dataset.id){ ui.confirmDeleteId=null; render(); } },3000); break;
    case 'confirm-delete-txn': state.transactions = state.transactions.filter(function(t){ return t.id!==el.dataset.id; }); ui.confirmDeleteId=null; await saveState(); render(); showToast('Movimiento eliminado.'); break;

    case 'save-goal': {
      var name = document.getElementById('goal-name').value.trim();
      var target = parseFloat(document.getElementById('goal-target').value);
      if(!name){ showToast('Dale un nombre a tu meta.'); return; }
      if(!target || target<=0){ showToast('Ingresa una cantidad objetivo válida.'); return; }
      var color = GOAL_COLORS[state.goals.length % GOAL_COLORS.length];
      state.goals.push({ id:uid(), name:name, target:target, legacyCurrent:0, color:color, createdAt:Date.now() });
      closeModal(); await saveState(); render(); showToast('Meta creada.');
      break;
    }
    case 'open-goal-fund': openGoalFundModal(el.dataset.id, el.dataset.dir); break;
    case 'save-goal-fund': {
      var amt = parseFloat(document.getElementById('goal-fund-amount').value);
      var accId = document.getElementById('goal-fund-account').value;
      var dateGoal = document.getElementById('goal-fund-date').value || todayStr();
      if(!amt || amt<=0){ showToast('Ingresa un monto válido.'); return; }
      if(!dateInMonthOk(dateGoal)){ showToast('La fecha debe estar dentro de '+monthLabel(ui.monthOffset).toLowerCase()+'.'); return; }
      if(ui.goalFundDirection==='in'){
        var b1 = accountBalance(accId);
        if(b1 < amt){ var a1=findAccount(accId); showToast('Tu wallet '+(a1?a1.name:'')+' solo tiene '+fmt(b1)+' disponibles.'); return; }
      } else {
        var cur1 = goalCurrent(ui.goalFundGoalId);
        if(cur1 < amt){ showToast('Solo tienes '+fmt(cur1)+' ahorrado en esta meta.'); return; }
      }
      state.transactions.push({ id:uid(), type: ui.goalFundDirection==='in' ? 'expense' : 'income', amount:amt, category: ui.goalFundDirection==='in' ? 'ahorro_meta' : 'retiro_meta', date:dateGoal, note:'', createdAt:Date.now(), accountId:accId, goalId:ui.goalFundGoalId });
      closeModal(); await saveState(); render(); showToast(ui.goalFundDirection==='in' ? '¡Meta actualizada!' : 'Retiro realizado.');
      break;
    }
    case 'ask-cancel-goal': ui.confirmDeleteGoalId = el.dataset.id; render(); setTimeout(function(){ if(ui.confirmDeleteGoalId===el.dataset.id){ ui.confirmDeleteGoalId=null; render(); } },3000); break;
    case 'confirm-cancel-goal': cancelGoal(el.dataset.id); ui.confirmDeleteGoalId=null; await saveState(); render(); showToast('Meta cancelada, tu dinero volvió a tus wallets.'); break;
    case 'ask-redeem-goal': ui.confirmRedeemGoalId = el.dataset.id; render(); setTimeout(function(){ if(ui.confirmRedeemGoalId===el.dataset.id){ ui.confirmRedeemGoalId=null; render(); } },3000); break;
    case 'confirm-redeem-goal': redeemGoal(el.dataset.id); ui.confirmRedeemGoalId=null; await saveState(); render(); showToast('¡Meta canjeada!'); break;
    case 'open-goal-history': openGoalHistoryModal(el.dataset.id); break;

    case 'edit-account': openAccountForm(el.dataset.id); break;
    case 'save-account': {
      var nameA = document.getElementById('account-name').value.trim();
      if(!nameA){ showToast('Dale un nombre al wallet.'); return; }
      var idA = el.dataset.id || null;
      var currencyElA = document.getElementById('account-currency');
      var currencyA = currencyElA ? (currencyElA.value || null) : null;
      if(idA){ updateAccountName(idA, nameA); var accEditA=findAccount(idA); if(accEditA) accEditA.currency = currencyA; } else { var balElA = document.getElementById('account-balance'); addAccount(nameA, balElA ? (parseFloat(balElA.value)||0) : 0, currencyA); }
      closeModal(); await saveState(); render(); showToast('Wallet guardado.');
      break;
    }
    case 'ask-delete-account': ui.confirmDeleteAccountId = el.dataset.id; render(); setTimeout(function(){ if(ui.confirmDeleteAccountId===el.dataset.id){ ui.confirmDeleteAccountId=null; render(); } },3000); break;
    case 'confirm-delete-account': { var okA = deleteAccount(el.dataset.id); if(!okA){ showToast('Debes dejar al menos un wallet.'); ui.confirmDeleteAccountId=null; render(); return; } ui.confirmDeleteAccountId=null; await saveState(); render(); showToast('Wallet eliminado.'); break; }

    case 'open-transfer': openTransferModal(); break;
    case 'save-transfer': {
      var fromId = document.getElementById('transfer-from').value;
      var toId = document.getElementById('transfer-to').value;
      var amtT = parseFloat(document.getElementById('transfer-amount').value);
      var dateT = document.getElementById('transfer-date').value || todayStr();
      var noteT = document.getElementById('transfer-note').value.trim();
      if(fromId===toId){ showToast('Elige dos wallets distintos.'); return; }
      if(!amtT || amtT<=0){ showToast('Ingresa un monto válido.'); return; }
      var accFromT = findAccount(fromId), accToT = findAccount(toId);
      if(accFromT && accToT && resolvedCurrency(accFromT)!==resolvedCurrency(accToT)){ showToast('Esos wallets están en monedas distintas — todavía no se puede transferir directo entre monedas.'); return; }
      var balT = accountBalance(fromId);
      if(balT < amtT){ var accT=findAccount(fromId); showToast('Tu wallet '+(accT?accT.name:'')+' solo tiene '+fmt(balT)+' disponibles.'); return; }
      state.transfers.push({ id:uid(), fromId:fromId, toId:toId, amount:amtT, date:dateT, note:noteT, createdAt:Date.now() });
      closeModal(); await saveState(); render(); showToast('Transferencia realizada.');
      break;
    }

    case 'open-bolsa-fund': openBolsaFundModal(el.dataset.dir); break;
    case 'save-bolsa-fund': {
      var amtB = parseFloat(document.getElementById('bolsa-fund-amount').value);
      var accB = document.getElementById('bolsa-fund-account').value;
      var dateB = document.getElementById('bolsa-fund-date').value || todayStr();
      if(!amtB || amtB<=0){ showToast('Ingresa un monto válido.'); return; }
      if(!dateInMonthOk(dateB)){ showToast('La fecha debe estar dentro de '+monthLabel(ui.monthOffset).toLowerCase()+'.'); return; }
      if(ui.bolsaFundDirection==='in'){
        var feeElB = document.getElementById('bolsa-fund-fee');
        var feeEnteredB = feeElB ? parseFloat(feeElB.value) : NaN;
        if(!feeEnteredB || feeEnteredB<=0){ showToast('Ingresa cuánto te cobraron de comisión — siempre te la cobran.'); return; }
        var totalDeductB = amtB + feeEnteredB;
        var balB = accountBalance(accB);
        if(balB < totalDeductB){ var accBx=findAccount(accB); showToast('Tu wallet '+(accBx?accBx.name:'')+' solo tiene '+fmt(balB)+' disponibles (necesitas '+fmt(totalDeductB)+' con la comisión incluida).'); return; }
        state.bolsa.amountInvested += amtB; state.bolsa.currentValue += amtB;
        var txnIdB = uid();
        state.transactions.push({ id:txnIdB, type:'expense', amount:amtB, category:'inversion_bolsa', date:dateB, note:'', createdAt:Date.now(), accountId:accB });
        state.transactions.push({ id:uid(), type:'expense', amount:feeEnteredB, category:'comisiones', date:dateB, note:'Comisión al invertir en la bolsa', createdAt:Date.now(), accountId:accB, bolsaFeeForMovement:txnIdB });
      } else {
        if(state.bolsa.currentValue < amtB){ showToast('Tu bolsa solo vale '+fmt(state.bolsa.currentValue)+'.'); return; }
        state.bolsa.currentValue -= amtB;
        state.bolsa.amountInvested = Math.max(0, state.bolsa.amountInvested - amtB);
        state.transactions.push({ id:uid(), type:'income', amount:amtB, category:'retiro_bolsa', date:dateB, note:'', createdAt:Date.now(), accountId:accB });
      }
      closeModal(); await saveState(); render(); showToast('Bolsa actualizada.');
      break;
    }
    case 'open-bolsa-update': openBolsaUpdateModal(); break;
    case 'save-bolsa-value': {
      var valB = parseFloat(document.getElementById('bolsa-newvalue').value);
      if(isNaN(valB) || valB<0){ showToast('Ingresa un valor válido.'); return; }
      state.bolsa.currentValue = valB; state.bolsa.lastUpdated = todayStr();
      closeModal(); await saveState(); render(); showToast('Valor actualizado.');
      break;
    }
    case 'open-bolsa-fix-account': openBolsaFixAccountModal(el.dataset.id); break;
    case 'save-bolsa-fix-account': {
      var txnFix = state.transactions.find(function(x){ return x.id===el.dataset.id; });
      if(!txnFix) return;
      var newAccFix = document.getElementById('bolsa-fix-account').value;
      if(newAccFix === txnFix.accountId){ showToast('Elige un wallet distinto.'); return; }
      var feeTxnFix = state.transactions.find(function(t){ return t.bolsaFeeForMovement===txnFix.id; });
      var totalNeededFix = txnFix.amount + (feeTxnFix?feeTxnFix.amount:0);
      var balNewFix = accountBalance(newAccFix);
      if(balNewFix < totalNeededFix){ var accNewFixX=findAccount(newAccFix); showToast('Tu wallet '+(accNewFixX?accNewFixX.name:'')+' solo tiene '+fmt(balNewFix)+' disponibles.'); return; }
      txnFix.accountId = newAccFix;
      if(feeTxnFix) feeTxnFix.accountId = newAccFix;
      closeModal(); await saveState(); render(); showToast('Wallet corregido.');
      break;
    }

    case 'set-debt-kind': ui.debtKind = el.dataset.kind; openDebtModal(); break;
    case 'save-debt': {
      var person = document.getElementById('debt-person').value.trim();
      var amountD = parseFloat(document.getElementById('debt-amount').value);
      var dueDate = document.getElementById('debt-due').value || null;
      var noteD = document.getElementById('debt-note').value.trim();
      if(!person){ showToast('Dale un nombre o descripción.'); return; }
      if(!amountD || amountD<=0){ showToast('Ingresa un monto válido.'); return; }
      var newDebt = { id:uid(), kind:ui.debtKind, person:person, amount:amountD, dueDate:dueDate, note:noteD, settled:false, createdAt:Date.now(), originAccountId:null, payments:[] };
      state.debts.push(newDebt);
      closeModal(); await saveState(); render(); showToast('Deuda guardada.');
      break;
    }
    case 'open-debt-payment': openDebtPaymentModal(el.dataset.id); break;
    case 'save-debt-payment': {
      var dObj = findDebt(el.dataset.id); if(!dObj) return;
      var amtP = parseFloat(document.getElementById('debt-payment-amount').value);
      var accP = document.getElementById('debt-payment-account').value;
      var dateP = document.getElementById('debt-payment-date').value || todayStr();
      var remainingP = debtRemaining(dObj);
      if(!amtP || amtP<=0){ showToast('Ingresa un monto válido.'); return; }
      if(amtP > remainingP + 0.004){ showToast('Ese monto es mayor a lo que falta ('+fmt(remainingP)+').'); return; }
      if(dObj.kind==='debo'){
        var balP = accountBalance(accP);
        if(balP < amtP){ var accPx=findAccount(accP); showToast('Tu wallet '+(accPx?accPx.name:'')+' solo tiene '+fmt(balP)+' disponibles.'); return; }
      }
      state.transactions.push({ id:uid(), type: dObj.kind==='debo' ? 'expense' : 'income', amount:amtP, category: dObj.kind==='debo' ? 'pago_deuda' : 'cobro_deuda', date:dateP, note: dObj.kind==='debo' ? ('Abono a deuda de '+dObj.person) : ('Cobro de deuda de '+dObj.person), createdAt:Date.now(), accountId:accP, debtId:dObj.id });
      if(debtRemaining(dObj) <= 0.004) dObj.settled = true;
      closeModal(); await saveState(); render(); showToast(dObj.kind==='debo' ? 'Abono registrado.' : 'Cobro registrado.');
      break;
    }
    case 'open-debt-history': openDebtHistoryModal(el.dataset.id); break;
    case 'ask-delete-debt': ui.confirmDeleteDebtId = el.dataset.id; render(); setTimeout(function(){ if(ui.confirmDeleteDebtId===el.dataset.id){ ui.confirmDeleteDebtId=null; render(); } },3000); break;
    case 'confirm-delete-debt': state.debts = state.debts.filter(function(d){ return d.id!==el.dataset.id; }); ui.confirmDeleteDebtId=null; await saveState(); render(); showToast('Eliminado.'); break;

    case 'set-theme': state.theme = el.dataset.theme; applyTheme(); await saveState(); render(); openSettings(); break;
    case 'save-settings': {
      var cur = document.getElementById('settings-currency').value;
      state.currency = cur;
      if(cur==='OTRO'){ state.customSymbol = document.getElementById('settings-symbol').value.trim() || '$'; }
      closeModal(); await saveState(); render(); showToast('Ajustes guardados.');
      break;
    }
    case 'open-income-estimate': openIncomeEstimateModal(); break;
    case 'save-income-estimate': {
      var valE = parseFloat(document.getElementById('income-estimate-amount').value);
      if(!valE || valE<=0){ showToast('Ingresa un monto válido.'); return; }
      setMonthEstimate(ui.monthOffset, valE);
      closeModal(); await saveState(); render(); showToast('Estimado guardado.');
      break;
    }
    case 'ask-reset': askReset(); break;
    case 'do-reset': { state = defaultState(); closeModal(); await saveState(); render(); showToast('Tus datos se borraron.'); break; }
    case 'logout': { closeModal(); clearSecret(currentUser); localStorage.removeItem('mvo-last-user'); state = null; showUserPicker(); break; }

    case 'manage-cats': captureTxnDraft(); ui.catFormReturn='catmanage'; openCatManageSheet(ui.txnType); break;
    case 'close-catmanage': renderTxnModal(); break;
    case 'add-cat': ui.catFormReturn='catmanage'; ui.tempCatColor = CATEGORY_COLOR_PALETTE[0]; openCategoryForm(el.dataset.type, null); break;
    case 'edit-cat': { var cE = catList(el.dataset.type).find(function(x){ return x.id===el.dataset.id; }); ui.catFormReturn='catmanage'; ui.tempCatColor = cE ? cE.color : CATEGORY_COLOR_PALETTE[0]; openCategoryForm(el.dataset.type, el.dataset.id); break; }
    case 'quick-add-cat': captureTxnDraft(); ui.catFormReturn='txn'; ui.tempCatColor = CATEGORY_COLOR_PALETTE[0]; openCategoryForm(ui.txnType, null); break;
    case 'pick-cat-color': { var nameNow = document.getElementById('cat-name-input') ? document.getElementById('cat-name-input').value : undefined; ui.tempCatColor = el.dataset.color; openCategoryForm(el.dataset.type, el.dataset.id || null, nameNow); break; }
    case 'save-cat': {
      var typeC = el.dataset.type; var nameC = document.getElementById('cat-name-input').value.trim();
      if(!nameC){ showToast('Dale un nombre a la categoría.'); return; }
      var colorC = ui.tempCatColor || CATEGORY_COLOR_PALETTE[0];
      var catIdC = el.dataset.id || null;
      var newIdC = catIdC;
      if(catIdC){ updateCategory(typeC, catIdC, nameC, colorC); } else { addCategory(typeC, nameC, colorC); newIdC = catList(typeC)[catList(typeC).length-1].id; }
      await saveState();
      ui.tempCatColor = null;
      if(ui.catFormReturn==='txn'){ ui.txnType = typeC; ui.txnCat = newIdC; renderTxnModal(); } else { catFormBack(); }
      render();
      showToast('Categoría guardada.');
      break;
    }
    case 'delete-cat-from-form': {
      var okC = deleteCategory(el.dataset.type, el.dataset.id);
      if(!okC){ showToast('Debes dejar al menos una categoría.'); return; }
      await saveState(); render();
      if(ui.catFormReturn==='txn'){ ui.txnCat=null; renderTxnModal(); } else { catFormBack(); }
      showToast('Categoría eliminada.');
      break;
    }
    case 'ask-delete-cat': ui.confirmDeleteCatId = el.dataset.id; openCatManageSheet(el.dataset.type); setTimeout(function(){ if(ui.confirmDeleteCatId===el.dataset.id){ ui.confirmDeleteCatId=null; if(document.querySelector('[data-modal="catmanage"]')) openCatManageSheet(el.dataset.type); } },3000); break;
    case 'confirm-delete-cat': { deleteCategory(el.dataset.type, el.dataset.id); ui.confirmDeleteCatId=null; await saveState(); render(); openCatManageSheet(el.dataset.type); showToast('Categoría eliminada.'); break; }
    case 'cancel-cat-form': ui.tempCatColor = null; catFormBack(); break;

    case 'add-book': openAddBookModal(); break;
    case 'save-book': {
      var bName = document.getElementById('book-name').value.trim();
      var bPages = parseInt(document.getElementById('book-pages').value, 10);
      if(!bName){ showToast('Dale un nombre al libro.'); return; }
      if(!bPages || bPages<=0){ showToast('Ingresa un número de páginas válido.'); return; }
      state.books.push({ id:uid(), name:bName, totalPages:bPages, currentPage:0, done:false, createdAt:Date.now(), finishedAt:null });
      closeModal(); await saveState(); render(); showToast('Libro agregado.');
      break;
    }
    case 'open-book-progress': openBookProgressModal(el.dataset.id); break;
    case 'save-book-progress': {
      var bk = findBook(el.dataset.id); if(!bk) return;
      var pageVal = parseInt(document.getElementById('book-current-page').value, 10);
      if(isNaN(pageVal) || pageVal<0){ showToast('Ingresa una página válida.'); return; }
      if(pageVal > bk.totalPages) pageVal = bk.totalPages;
      bk.currentPage = pageVal;
      if(pageVal >= bk.totalPages){ bk.done = true; bk.finishedAt = todayStr(); } else { bk.done = false; bk.finishedAt = null; }
      var pctSaved = bookProgressPct(bk);
      closeModal(); await saveState(); render(); showToast(bk.done ? '¡Libro finalizado!' : ('Vas por el '+pctSaved+'%.'));
      break;
    }
    case 'toggle-card-expand': {
      var idExp = el.dataset.id;
      ui.expandedCards[idExp] = !ui.expandedCards[idExp];
      render();
      break;
    }
    case 'set-currency-tab': ui.currencyTab = el.dataset.currency; render(); break;

    case 'toggle-exercise-day': {
      var exDate = el.dataset.date;
      if(exDate > dateToStr(new Date())) return;
      var exIdx = state.exerciseLogs.indexOf(exDate);
      if(exIdx > -1) state.exerciseLogs.splice(exIdx,1); else state.exerciseLogs.push(exDate);
      await saveState(); render();
      break;
    }
    case 'add-exercise-goal': openExerciseGoalModal(); break;
    case 'save-exercise-goal': {
      var goalDate = document.getElementById('exercise-goal-date').value;
      if(!goalDate){ showToast('Elige una fecha.'); return; }
      state.exerciseGoal = { targetDate: goalDate, createdAt: Date.now() };
      closeModal(); await saveState(); render(); showToast('Meta guardada.');
      break;
    }
    case 'delete-exercise-goal': state.exerciseGoal = null; await saveState(); render(); showToast('Meta eliminada.'); break;
  }
}

var tooltipEl = null;
function ensureTooltip(){ if(!tooltipEl){ tooltipEl = document.createElement('div'); tooltipEl.className = 'chart-tooltip'; document.body.appendChild(tooltipEl); } return tooltipEl; }
function showTooltip(text, x, y){
  var t = ensureTooltip();
  t.textContent = text;
  var vw = window.innerWidth, vh = window.innerHeight;
  var left = x + 14, top = y + 14;
  t.style.left = left + 'px'; t.style.top = top + 'px';
  t.classList.add('show');
  var rect = t.getBoundingClientRect();
  if(rect.right > vw - 8){ t.style.left = (x - rect.width - 14) + 'px'; }
  if(rect.bottom > vh - 8){ t.style.top = (y - rect.height - 14) + 'px'; }
}
function hideTooltip(){ if(tooltipEl) tooltipEl.classList.remove('show'); }
document.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch') return;
  var el = e.target.closest('[data-tooltip]');
  if(el){ showTooltip(el.getAttribute('data-tooltip'), e.clientX, e.clientY); }
  else { hideTooltip(); }
});
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest('[data-tooltip]');
  if(el && e.pointerType==='touch'){ showTooltip(el.getAttribute('data-tooltip'), e.clientX, e.clientY); clearTimeout(showTooltip._t); showTooltip._t = setTimeout(hideTooltip, 2200); }
});
document.addEventListener('scroll', hideTooltip, true);

document.addEventListener('click', function(e){
  if(e.target.classList && e.target.classList.contains('overlay')){ closeModal(); return; }
  var actionEl = e.target.closest('[data-action]');
  if(actionEl){ handleAction(actionEl.dataset.action, actionEl); return; }
  var railBtn = e.target.closest('.rail button[data-section]');
  if(railBtn){ ui.section = railBtn.dataset.section; if(ui.section==='finanzas') ui.tab='resumen'; render(); return; }
  var finTab = e.target.closest('[data-fintab]');
  if(finTab){ ui.tab = finTab.dataset.fintab; render(); return; }
});
document.addEventListener('change', function(e){
  if(e.target.id==='settings-currency'){ document.getElementById('custom-symbol-field').style.display = e.target.value==='OTRO' ? 'block' : 'none'; }
});
document.addEventListener('input', function(e){
  if(e.target.id==='book-current-page'){
    var totalP = parseInt(e.target.dataset.total,10);
    var preview = document.getElementById('book-progress-preview');
    if(!preview || !totalP) return;
    var val = parseInt(e.target.value,10);
    if(isNaN(val)) val = 0;
    val = Math.min(Math.max(val,0), totalP);
    var pct = Math.round((val/totalP)*100);
    preview.textContent = 'Vas por el '+pct+'%.';
  }
});

window.addEventListener('resize', function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ if(state) render(); }, 150); });

function showUserPicker(){
  currentUser = null;
  document.getElementById('app').style.display='none';
  var root = document.getElementById('lock-root');
  root.innerHTML =
    '<div class="lock-card">'+
      '<div class="lock-title">Mi Vida Organizada</div>'+
      '<div class="lock-sub">¿Quién eres?</div>'+
      '<div class="user-picker">'+
        USERS.map(function(u){ return '<button class="btn-user" data-user="'+esc(u.id)+'" type="button">'+esc(u.name)+'</button>'; }).join('')+
      '</div>'+
    '</div>';
  root.style.display='flex';
  var btns = root.querySelectorAll('.btn-user');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(e){ selectUser(e.currentTarget.getAttribute('data-user')); });
  }
}
async function selectUser(userId){
  if(hasSecret(userId)){
    currentUser = userId;
    setLastUser(userId);
    document.getElementById('lock-root').style.display='none';
    document.getElementById('lock-root').innerHTML='';
    document.getElementById('app').style.display='';
    await boot();
  } else {
    showLockScreen(userId);
  }
}
function showLockScreen(userId, errorMsg){
  currentUser = userId;
  document.getElementById('app').style.display='none';
  var user = findUser(userId);
  var name = user ? user.name : '';
  var root = document.getElementById('lock-root');
  root.innerHTML =
    '<div class="lock-card">'+
      '<div class="lock-title">Mi Vida Organizada</div>'+
      '<div class="lock-sub">Clave de '+esc(name)+'</div>'+
      (errorMsg ? '<div class="lock-error">'+esc(errorMsg)+'</div>' : '')+
      '<input type="password" id="lock-input" class="lock-input" placeholder="Tu clave" autocomplete="off">'+
      '<button class="btn-primary" id="lock-submit" type="button">Entrar</button>'+
      '<button class="btn-text lock-back" id="lock-back" type="button">No soy '+esc(name)+'</button>'+
    '</div>';
  root.style.display='flex';
  var input = document.getElementById('lock-input');
  input.focus();
  document.getElementById('lock-submit').addEventListener('click', function(){ submitLock(userId); });
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submitLock(userId); });
  document.getElementById('lock-back').addEventListener('click', showUserPicker);
}
async function submitLock(userId){
  var input = document.getElementById('lock-input');
  var val = (input.value||'').trim();
  if(!val) return;
  setSecret(userId, val);
  currentUser = userId;
  setLastUser(userId);
  document.getElementById('lock-root').style.display='none';
  document.getElementById('lock-root').innerHTML='';
  document.getElementById('app').style.display='';
  await boot();
}
async function boot(){
  document.getElementById('lock-root').style.display='none';
  document.getElementById('app').style.display='';
  state = await loadState();
  render();
}
(async function init(){
  var last = getLastUser();
  if(last && findUser(last) && hasSecret(last)){
    currentUser = last;
    await boot();
  } else {
    showUserPicker();
  }
})();
</script>
